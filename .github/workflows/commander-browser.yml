name: Commander reoptimization browser check
on:
  pull_request:
    paths:
      - 'src/**'
      - 'optimizer-service/**'
      - 'package.json'
      - '.github/workflows/commander-browser.yml'
      - '.github/tests/commander-browser.mjs'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: optimizer-service/requirements.txt
      - run: bun install
      - run: bun run test src/tests/repository.test.ts src/tests/commanderService.test.ts
      - run: bun run build
        env:
          VITE_OPTIMIZER_API_URL: http://127.0.0.1:8765
      - run: python -m pip install -r optimizer-service/requirements.txt
      - run: |
          npm install --prefix "$RUNNER_TEMP/e4k-browser" playwright@1.58.2
          "$RUNNER_TEMP/e4k-browser/node_modules/.bin/playwright" install chromium --with-deps
      - run: |
          CORS_ORIGINS=http://127.0.0.1:4173 python -m uvicorn app:app --app-dir optimizer-service --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/optimizer.log" 2>&1 &
          bun run preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8765/health
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4173/
          NODE_PATH="$RUNNER_TEMP/e4k-browser/node_modules" node .github/tests/commander-browser.mjs
      - if: failure()
        run: |
          for log in optimizer vite; do
            if [ -f "$RUNNER_TEMP/$log.log" ]; then cat "$RUNNER_TEMP/$log.log"; fi
          done
